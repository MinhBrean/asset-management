version: '3.8'

services:
  db:
    image: postgres:14
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: asset_management
    ports:
      - '5432:5432'
  backend:
    build: ./backend
    ports:
      - '3000:3000'
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://user:password@db:5432/asset_management
  frontend:
    build: ./frontend
    ports:
      - '3001:3000'
    depends_on:
      - backend
